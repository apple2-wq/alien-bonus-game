<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3 STAGE SHOOTING MANIA - TOP 3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080319;color:#fff;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif}
button,input{font:inherit}
#gameFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#080319}
.overlay{position:fixed;inset:0;z-index:10000;display:none}
#stageResultScreen{flex-direction:column;justify-content:center;align-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(110,46,184,.97),rgba(7,2,35,.99))}
.stage-finish-title{color:#ffe457;font-size:clamp(38px,7vw,92px);font-weight:1000;letter-spacing:.04em;text-shadow:5px 5px 0 #5a1c92,0 0 24px #ff9c25}
.stage-score-row{display:flex;gap:clamp(24px,8vw,130px);margin:26px 0 18px}.stage-score{font-size:clamp(24px,4vw,54px);font-weight:1000}.p1-color{color:#55eaff}.p2-color{color:#ff6bba}
#nextStageText{font-size:clamp(18px,2.6vw,34px);font-weight:900}#nextSeconds{color:#ffe457;font-size:1.35em}
#finalResultScreen{overflow:hidden;background:#130d09}
.result-frame{position:absolute;left:50%;top:50%;width:min(100vw,177.78vh);height:min(100vh,56.25vw);transform:translate(-50%,-50%);overflow:hidden;background-image:url("./result-screen-western-v2-light.webp?v=3");background-position:center;background-size:100% 100%;background-repeat:no-repeat;color:#392413;font-family:Georgia,"Times New Roman","Hiragino Mincho ProN",serif;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.final-title{display:none}
.player-grid{position:absolute;inset:0}
.player-card{position:absolute;top:0;width:50%;height:100%;text-align:center}.p1-card{left:0}.p2-card{right:0}
.player-name{position:absolute;top:10.5%;left:17%;width:66%;height:7.5%;display:flex;align-items:center;justify-content:center;margin:0;color:#fff6d8;font-size:clamp(15px,2.2vw,38px);font-weight:1000;letter-spacing:.04em;text-shadow:0 3px 0 #332014,0 0 5px rgba(0,0,0,.7)}
.label-plate{position:absolute;left:18%;width:64%;margin:0;padding:0;border:0;background:none;box-shadow:none;color:#52351f;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;font-size:clamp(9px,1.25vw,21px);font-weight:1000;letter-spacing:.03em;text-shadow:none}.player-card .label-plate:nth-of-type(2){top:21.4%}.player-card .label-plate:nth-of-type(4){top:43.7%}
.score-digits{position:absolute;left:11%;top:25%;width:78%;height:14%;display:flex;align-items:center;justify-content:center;gap:.55%;margin:0}.digit{display:grid;place-items:center;width:14.5%;height:86%;border:clamp(1px,.25vw,4px) solid #a79578;border-radius:clamp(2px,.5vw,8px);background:linear-gradient(#fffdf3,#e9ddc4);box-shadow:inset 0 0 .7vw rgba(67,42,20,.17),0 .35vw 0 #a89472;font-family:Georgia,serif;font-size:clamp(20px,4.1vw,67px);font-weight:1000;line-height:1}.p1-card .digit{color:#087e9c}.p2-card .digit{color:#ba245e}
.accuracy{position:absolute;left:21%;top:45.8%;width:58%;height:7%;display:flex;align-items:center;justify-content:center;color:#422b1d;font-size:clamp(19px,3.2vw,54px);font-weight:1000;text-shadow:0 2px 0 #fff}.stage-details{position:absolute;left:10%;top:52.7%;width:80%;color:#513721;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;font-size:clamp(7px,.75vw,13px);font-weight:900;line-height:1.2;text-shadow:none}
.rank-grid{position:absolute;inset:0}.rank-card{position:absolute;top:62%;height:21.5%;padding:4.1% 2% 1%;border:0;background:none;color:#4a301c}.rank-card:nth-child(1){left:3.3%;width:30%}.rank-card:nth-child(2){left:35.2%;width:29.6%}.rank-card:nth-child(3){left:66.4%;width:30.2%}.rank-card h3{position:absolute;left:5%;top:-10%;width:90%;margin:0;color:#fff0d0;font-size:clamp(9px,1.25vw,21px);font-weight:1000;line-height:1;text-align:center;text-shadow:0 2px 0 #3b2518}
.rank-card h3{top:-2%}
.ranking-list{position:absolute;left:11%;top:14%;width:78%;margin:0;padding-left:13%;font-size:clamp(9px,1.1vw,18px);font-weight:1000;line-height:1.24}.ranking-list li::marker{color:#a66a13;font-weight:1000}.rank-line{display:block;text-align:right}.rank-line span:last-child{font-size:1.05em}
.pair-box{position:absolute;left:4%;top:11%;width:92%;height:68%;display:grid;grid-template-columns:1fr 1fr;gap:3%}.pair-record{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 2%;border-radius:0;background:none;text-align:center}.pair-record small{display:block;color:#6d4b2d;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;font-size:clamp(7px,.85vw,14px);font-weight:900}.pair-record strong{display:block;margin:3% 0;color:#9b5a09;font-size:clamp(12px,1.65vw,28px);white-space:nowrap}.pair-record span{max-width:100%;overflow:hidden;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;font-size:clamp(7px,.8vw,13px);font-weight:900;white-space:nowrap;text-overflow:ellipsis}
.button-row{position:absolute;left:31.5%;top:86.5%;width:37%;height:9%;display:flex;align-items:center;justify-content:center;margin:0}.main-button,.staff-button,.modal-button{cursor:pointer}.main-button{width:100%;height:100%;padding:0;border:0;background:transparent;color:#fff5d2;font-family:Georgia,"Times New Roman",serif;font-size:clamp(14px,2vw,34px);font-weight:1000;letter-spacing:.08em;text-shadow:0 3px 0 #361b0e,0 0 5px #000}.main-button small{display:block;margin-top:-1%;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;font-size:.42em;letter-spacing:.08em}.staff-button{position:fixed;right:1.6%;bottom:1.8%;padding:.35em .7em;border:1px solid rgba(255,255,255,.65);border-radius:6px;background:rgba(25,15,10,.74);color:#fff;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;font-size:clamp(7px,.7vw,11px);font-weight:800}
#nameModal{z-index:20000;justify-content:center;align-items:center;padding:20px;background:rgba(0,0,0,.82)}.modal-card{width:min(520px,94vw);padding:24px;border:5px solid #ffe154;border-radius:20px;background:linear-gradient(#48227e,#1d0c48);box-shadow:0 0 30px #ffad2d;text-align:center}#nameModalTitle{margin:0 0 8px;font-size:clamp(23px,4vw,38px)}.name-note{margin:0 0 14px;color:#f4eaff;font-size:14px}#nameInput{width:100%;padding:12px;border:3px solid #d9c8ff;border-radius:12px;font-size:24px;text-align:center}.modal-button{margin-top:15px;background:#d94b28}/* ヒット率まわりを少しだけ下へ */
.player-card .label-plate:nth-of-type(4) {
    top: 44.3%;
}
.accuracy {
    top: 46.4%;
}
.stage-details {
    top: 53.3%;
}
/* 下3枠の中身だけ下へ */
.ranking-list {
    top: 22%;
}
.pair-box {
    top: 18%;
}
/* 左・真ん中のランキングだけ下げる */
.rank-card:nth-child(1) .ranking-list,
.rank-card:nth-child(2) .ranking-list {
    top: 29.5%;
    line-height: 1.8;
}
/* ステージ別得点を少し読みやすく */
.stage-details {
    font-size: clamp(8px, 0.82vw, 14px);
}
/* 日本語を洋風の明朝系で統一 */
.player-name,
.label-plate,
.rank-card h3,
.ranking-list,
.pair-record small,
.pair-record span,
.main-button small,
.staff-button {
    font-family:
        Georgia,
        "Yu Mincho",
        "Hiragino Mincho ProN",
        "Hiragino Mincho Pro",
        serif;
    font-weight: 900;
}

</style>
</head>
<body>
<iframe id="gameFrame" src="friend-stage/index.html" title="3ステージシューティングゲーム"></iframe>

<div id="stageResultScreen" class="overlay">
  <div id="stageFinishTitle" class="stage-finish-title">STAGE FINISH!</div>
  <div class="stage-score-row">
    <div class="stage-score p1-color">🩵 水色　<span id="stageScore1">0</span>点</div>
    <div class="stage-score p2-color">🩷 ピンク　<span id="stageScore2">0</span>点</div>
  </div>
  <div id="nextStageText"><span id="nextSeconds">5</span>秒後に次のステージ！</div>
</div>

<div id="finalResultScreen" class="overlay">
  <div class="result-frame">
    <h1 class="final-title">ALL 3 STAGES FINISH!</h1>
    <div class="player-grid">
      <section class="player-card p1-card">
        <div class="player-name p1-color">水色プレイヤー</div>
        <div class="label-plate">トータルスコア</div>
        <div id="finalDigits1" class="score-digits"></div>
        <div class="label-plate">ACCURACY　ヒット率</div>
        <div id="finalAccuracy1" class="accuracy">0%</div>
        <div id="stageDetails1" class="stage-details"></div>
      </section>
      <section class="player-card p2-card">
        <div class="player-name p2-color">ピンクプレイヤー</div>
        <div class="label-plate">トータルスコア</div>
        <div id="finalDigits2" class="score-digits"></div>
        <div class="label-plate">ヒット率</div>
        <div id="finalAccuracy2" class="accuracy">0%</div>
        <div id="stageDetails2" class="stage-details"></div>
      </section>
    </div>
    <div class="rank-grid">
      <section class="rank-card"><h3 id="todayRankTitle">今日の個人 TOP 3</h3><ol id="todayRanking" class="ranking-list"></ol></section>
      <section class="rank-card"><h3>文化祭2日間 個人 TOP 3</h3><ol id="eventRanking" class="ranking-list"></ol></section>
      <section class="rank-card">
        <h3>2人合計 最高記録</h3>
        <div class="pair-box">
          <div class="pair-record"><small>今日</small><strong id="todayPairScore">---点</strong><span id="todayPairName">まだ記録なし</span></div>
          <div class="pair-record"><small>文化祭2日間</small><strong id="eventPairScore">---点</strong><span id="eventPairName">まだ記録なし</span></div>
        </div>
      </section>
    </div>
    <div class="button-row">
      <button id="playAgainButton" class="main-button" type="button">NEXT PLAYERS<small>次のプレイヤーへ</small></button>
      <button id="resetRecordsButton" class="staff-button" type="button">運営用：記録リセット</button>
    </div>
  </div>
</div>

<div id="nameModal" class="overlay">
  <div class="modal-card">
    <h2 id="nameModalTitle">NEW RECORD!</h2>
    <p class="name-note">12文字以内のペアネームを入力してね</p>
    <input id="nameInput" type="text" maxlength="12" autocomplete="off">
    <button id="saveNameButton" class="modal-button" type="button">登録する</button>
  </div>
</div>

<script>
const STAGES=[
  {id:"friend",name:"FARM STAGE",src:"friend-stage/index.html"},
  {id:"alien",name:"ALIEN STAGE",src:"alien-stage6.html"},
  {id:"bonus",name:"BONUS STAGE",src:"bonus-stage4.html"}
];
const EVENT_DATES=["2026-09-27","2026-09-28"];
const RECORDS_KEY="threeStageShootingRecordsV1";
const gameFrame=document.getElementById("gameFrame");
const stageResultScreen=document.getElementById("stageResultScreen");
const finalResultScreen=document.getElementById("finalResultScreen");
const nameModal=document.getElementById("nameModal");
const nameInput=document.getElementById("nameInput");
let currentStageIndex=0;
let stageHandled=false;
let stageResults=[];
let pendingNameResolve=null;

function emptyResult(stage){return{finished:true,stage,score1:0,score2:0,shots1:0,shots2:0,hits1:0,hits2:0}}
function normalizeResult(value){
  const result=Object.assign(emptyResult(STAGES[currentStageIndex].id),value||{});
  ["score1","score2","shots1","shots2","hits1","hits2"].forEach(key=>{result[key]=Number(result[key])||0});
  return result;
}
function accuracy(hits,shots){return shots<=0?0:Math.min(100,Math.round(hits/shots*100))}
function dateKey(){const now=new Date();return`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`}
function shortDate(key){const parts=key.split("-");return`${Number(parts[1])}/${Number(parts[2])}`}
function loadRecords(){try{const saved=JSON.parse(localStorage.getItem(RECORDS_KEY));return saved&&saved.days?saved:{days:{}}}catch(error){return{days:{}}}}
function saveRecords(records){localStorage.setItem(RECORDS_KEY,JSON.stringify(records))}
function ensureDay(records,key){if(!records.days[key])records.days[key]={individuals:[],pairs:[]};return records.days[key]}
function sortedTop(list,limit){return[...list].sort((a,b)=>b.score-a.score||a.time-b.time).slice(0,limit)}
function eventIndividuals(records){return sortedTop(EVENT_DATES.flatMap(key=>records.days[key]?.individuals||[]),3)}
function eventPairs(records){return sortedTop(EVENT_DATES.flatMap(key=>records.days[key]?.pairs||[]),1)}
function qualifiesForTopThree(list,score){const top=sortedTop(list,3);return top.length<3||score>top[top.length-1].score}

function askName(title,fallback){
  return new Promise(resolve=>{
    document.getElementById("nameModalTitle").textContent=title;
    nameInput.value=fallback;
    nameModal.style.display="flex";
    nameInput.focus();nameInput.select();pendingNameResolve=resolve;
  });
}
function finishNameInput(){
  if(!pendingNameResolve)return;
  const value=nameInput.value.trim().slice(0,12)||"ゲスト";
  const resolve=pendingNameResolve;pendingNameResolve=null;nameModal.style.display="none";resolve(value);
}
document.getElementById("saveNameButton").addEventListener("click",finishNameInput);
nameInput.addEventListener("keydown",event=>{if(event.key==="Enter")finishNameInput()});

function renderDigits(element,score){
  element.innerHTML="";
  const text=String(Math.max(0,Math.round(score))).padStart(6,"0").slice(-6);
  for(const character of text){const digit=document.createElement("span");digit.className="digit";digit.textContent=character;element.appendChild(digit)}
}
function renderRanking(element,list){
  element.innerHTML="";
  if(list.length===0){const item=document.createElement("li");item.textContent="まだ記録なし";element.appendChild(item);return}
  list.forEach(record=>{const item=document.createElement("li"),line=document.createElement("span"),score=document.createElement("span");line.className="rank-line";score.textContent=`${record.score.toLocaleString()}点`;line.append(score);item.appendChild(line);element.appendChild(item)});
}
function renderPair(prefix,record){document.getElementById(`${prefix}PairScore`).textContent=record?`${record.score.toLocaleString()}点`:"---点";document.getElementById(`${prefix}PairName`).textContent=record?record.name:"まだ記録なし"}
function renderRecords(){
  const records=loadRecords(),today=dateKey(),todayData=records.days[today]||{individuals:[],pairs:[]};
  document.getElementById("todayRankTitle").textContent=`${shortDate(today)} 個人 TOP 3`;
  renderRanking(document.getElementById("todayRanking"),sortedTop(todayData.individuals,3));
  renderRanking(document.getElementById("eventRanking"),eventIndividuals(records));
  renderPair("today",sortedTop(todayData.pairs,1)[0]||null);
  renderPair("event",eventPairs(records)[0]||null);
}
function totalFor(playerNumber,key){return stageResults.reduce((sum,result)=>sum+result[`${key}${playerNumber}`],0)}
function stageBreakdown(playerNumber){return stageResults.map((result,index)=>`${STAGES[index].name}：${result[`score${playerNumber}`].toLocaleString()}点`).join("　／　")}

async function saveNewRecords(total1,total2,accuracy1,accuracy2){
  const records=loadRecords(),today=dateKey(),day=ensureDay(records,today),now=Date.now();
  const players=[
    {score:total1,accuracy:accuracy1},
    {score:total2,accuracy:accuracy2}
  ];
  for(const player of players){
    if(qualifiesForTopThree(day.individuals,player.score)){
      day.individuals.push({score:player.score,accuracy:player.accuracy,date:today,time:now});
      day.individuals=sortedTop(day.individuals,3);
    }
  }
  const pairScore=total1+total2;
  const todayPairTop=sortedTop(day.pairs,1)[0]?.score??-Infinity;
  const overallPairTop=eventPairs(records)[0]?.score??-Infinity;
  const isEventDay=EVENT_DATES.includes(today);
  if(pairScore>todayPairTop||(isEventDay&&pairScore>overallPairTop)){
    const pairName=await askName("2人合計の新記録！ ペアネーム","なかよしペア");
    day.pairs.push({name:pairName,score:pairScore,date:today,time:now});day.pairs=sortedTop(day.pairs,5);
  }
  saveRecords(records);renderRecords();
}

async function showFinalResult(){
  gameFrame.style.visibility="hidden";
  const total1=totalFor(1,"score"),total2=totalFor(2,"score");
  const shots1=totalFor(1,"shots"),shots2=totalFor(2,"shots");
  const hits1=totalFor(1,"hits"),hits2=totalFor(2,"hits");
  const accuracy1=accuracy(hits1,shots1),accuracy2=accuracy(hits2,shots2);
  renderDigits(document.getElementById("finalDigits1"),total1);renderDigits(document.getElementById("finalDigits2"),total2);
  document.getElementById("finalAccuracy1").textContent=`${accuracy1}%`;document.getElementById("finalAccuracy2").textContent=`${accuracy2}%`;
  document.getElementById("stageDetails1").textContent=stageBreakdown(1);document.getElementById("stageDetails2").textContent=stageBreakdown(2);
  finalResultScreen.style.display="block";renderRecords();await saveNewRecords(total1,total2,accuracy1,accuracy2);
}
function showStageResult(result){
  const stage=STAGES[currentStageIndex];
  document.getElementById("stageFinishTitle").textContent=`${stage.name} FINISH!`;
  document.getElementById("stageScore1").textContent=result.score1.toLocaleString();document.getElementById("stageScore2").textContent=result.score2.toLocaleString();
  stageResultScreen.style.display="flex";let seconds=5;document.getElementById("nextSeconds").textContent=seconds;
  const timer=setInterval(()=>{seconds--;document.getElementById("nextSeconds").textContent=Math.max(0,seconds);if(seconds<=0){clearInterval(timer);startNextStage()}},1000);
}
function handleStageFinished(rawResult){
  if(stageHandled)return;stageHandled=true;const result=normalizeResult(rawResult);stageResults[currentStageIndex]=result;
  if(currentStageIndex===STAGES.length-1)showFinalResult();else showStageResult(result);
}
function startNextStage(){currentStageIndex++;stageHandled=false;gameFrame.style.visibility="hidden";gameFrame.src=STAGES[currentStageIndex].src}
function prepareLoadedStage(){
  const stage=STAGES[currentStageIndex];
  try{
    const frameWindow=gameFrame.contentWindow,frameDocument=gameFrame.contentDocument;
    if(stage.id==="friend"){gameFrame.style.visibility="visible";return}
    if(stage.id==="alien"){frameDocument.getElementById("restartButton")?.remove();frameWindow.startIntro()}
    if(stage.id==="bonus"){frameDocument.getElementById("readyScreen")?.remove();frameWindow.runOpening()}
    setTimeout(()=>{gameFrame.style.visibility="visible";stageResultScreen.style.display="none"},100);
  }catch(error){console.log("ステージ開始エラー",error);gameFrame.style.visibility="visible";stageResultScreen.style.display="none"}
}
gameFrame.addEventListener("load",()=>setTimeout(prepareLoadedStage,100));
setInterval(()=>{
  if(stageHandled)return;
  try{
    const result=gameFrame.contentWindow.stageResult;
    const expectedStage=STAGES[currentStageIndex].id;

    /* 切替中に前のステージの結果を読み直さない */
    if(result?.finished&&result.stage===expectedStage){
      handleStageFinished(result);
    }
  }catch(error){
    console.log("結果待機中",error);
  }
},150);
document.getElementById("playAgainButton").addEventListener("click",()=>location.reload());
document.getElementById("resetRecordsButton").addEventListener("click",()=>{
  const answer=prompt("記録を全部消す場合は RESET と入力してください");if(answer!=="RESET")return;
  if(confirm("準備期間・文化祭当日の記録をすべて削除します。よろしいですか？")){localStorage.removeItem(RECORDS_KEY);renderRecords();alert("記録をリセットしました")}
});
</script>
</body>
</html>
