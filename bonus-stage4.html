<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, user-scalable=no"
>

<title>Bonus Stage 4</title>

<style>

/* ==========================================
   基本
========================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#game {
  position: relative;

  width: 100vw;
  height: 100vh;

  overflow: hidden;

  background-image: url("bonus-bg.png");
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;

  cursor: none;
}


/* =========================================
   HUD
========================================= */

#hud {
  position: absolute;

  top: 15px;
  left: 0;

  width: 100%;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 0 35px;

  z-index: 5000;

  pointer-events: none;
}

.scoreBox {
  padding: 8px 18px;

  font-size: 30px;
  font-weight: bold;

  background: rgba(0, 0, 0, .65);

  border: 3px solid white;
  border-radius: 15px;

  text-shadow:
    2px 2px 3px black;
}

#score1 {
  color: #55eaff;

  box-shadow:
    0 0 14px #55eaff;
}

#score2 {
  color: #ff6bba;

  box-shadow:
    0 0 14px #ff6bba;
}

#timer {
  padding: 8px 20px;

  font-size: 34px;
  font-weight: bold;

  color: #ffe76a;

  background: rgba(0, 0, 0, .65);

  border: 3px solid white;
  border-radius: 15px;

  text-shadow:
    2px 2px 4px black;
}


/* =========================================
   通常的 500点
========================================= */

.target {
  position: absolute;

  width: 145px;
height: 145px;

margin-left: -72.5px;
margin-top: -72.5px;

  background-image: url("target500.png");
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;

  background-color: transparent;

  border: none;
  border-radius: 0;

  box-shadow: none;

  color: transparent;

  display: flex;
  align-items: center;
  justify-content: center;

  user-select: none;
  pointer-events: none;

  transform-origin: center;

  filter:
    drop-shadow(0 3px 5px rgba(0,0,0,.45));
}


/* =========================================
   顔的 1000点
========================================= */

.target.specialTarget {
  background: transparent;

  background-image:
    url("target.png");

  background-size:
    contain;

  background-position:
    center;

  background-repeat:
    no-repeat;

  border: none;
  border-radius: 0;

  box-shadow: none;

  color: transparent;

  filter:
    drop-shadow(0 0 6px white)
    drop-shadow(0 0 12px #ffe45c)
    drop-shadow(0 0 20px #ffb300);

  animation:
    rareSparkle .45s
    infinite alternate;
}

@keyframes rareSparkle {

  0% {
    filter:
      drop-shadow(0 0 4px white)
      drop-shadow(0 0 8px #ffe45c)
      drop-shadow(0 0 12px #ffb300);
  }

  100% {
    filter:
      drop-shadow(0 0 8px white)
      drop-shadow(0 0 18px #fff36b)
      drop-shadow(0 0 28px #ffb300);
  }
}


/* =========================================
   照準
========================================= */

.crosshair {
  position: absolute;

  transform:
    translate(-50%, -50%);

  font-size: 65px;
  font-weight: bold;

  line-height: 1;

  pointer-events: none;
  user-select: none;

  z-index: 6000;
}


/* P1 右Joy-Con */

#crosshair1 {
  left: 40%;
  top: 55%;

  color: #55eaff;

  text-shadow:
    0 0 4px black,
    0 0 10px #55eaff,
    0 0 18px #55eaff;
}


/* P2 左Joy-Con */

#crosshair2 {
  left: 60%;
  top: 55%;

  color: #ff6bba;

  text-shadow:
    0 0 4px black,
    0 0 10px #ff6bba,
    0 0 18px #ff6bba;
}


/* =========================================
   +500 / +1000
========================================= */

.plusScore {
  position: absolute;

  transform:
    translate(-50%, -50%);

  font-size: 38px;
  font-weight: 900;

  color: #fff36b;

  text-shadow:
    0 0 4px black,
    0 0 8px black;

  pointer-events: none;

  z-index: 7000;

  animation:
    plusAnimation .65s forwards;
}

.plusScore.special {
  font-size: 52px;

  color: #ffe135;

  text-shadow:
    0 0 5px black,
    0 0 12px #ff9d00,
    0 0 20px #ffe135;
}

@keyframes plusAnimation {

  0% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(.8);
  }

  100% {
    opacity: 0;

    transform:
      translate(-50%, -120%)
      scale(1.3);
  }
}


/* =========================================
   開始演出
========================================= */

#opening {
  position: absolute;

  inset: 0;

  overflow: hidden;

  z-index: 10000;

  background:
  linear-gradient(
    rgba(8, 0, 6, 0.12),
    rgba(8, 0, 6, 0.12)
  ),
  url("bonus-bg.png") center / cover no-repeat;
}


/* =========================================
   カーテン
========================================= */

.curtain {
  position: absolute;

  top: -15%;

  width: 58%;
  height: 135%;

  /* ウエスタン風：赤茶～えんじの布 */
  background:
    repeating-linear-gradient(
      90deg,
      #3b160f 0px,
      #6b2418 38px,
      #923522 72px,
      #5b1d14 108px,
      #32110c 135px
    );

  box-shadow:
    inset 0 0 45px rgba(255,190,95,.15),
    inset 0 0 90px rgba(0,0,0,.75);

  z-index: 3;

  transition:
    transform 1.25s
    cubic-bezier(.55,.02,.25,1);
}


/* 左カーテン */

#curtainLeft {
  left: -7%;

  transform:
    skewY(-7deg)
    translateX(0);
}


/* 右カーテン */

#curtainRight {
  right: -7%;

  transform:
    skewY(7deg)
    translateX(0);
}


/* 開く */

#opening.open #curtainLeft {
  transform:
    skewY(-13deg)
    translateX(-110%);
}

#opening.open #curtainRight {
  transform:
    skewY(13deg)
    translateX(110%);
}


/* =========================================
   カーテンの金色ライン
========================================= */

.curtainEdge {
  position: absolute;

  top: 0;

  width: 12px;
  height: 100%;

  /* 派手な黄色光 → 古い金属っぽい金色 */
  background:
    linear-gradient(
      90deg,
      #6f4318,
      #d7a64c,
      #fff0a0,
      #b87527,
      #5d3613
    );

  box-shadow:
    0 0 4px rgba(255,220,130,.7),
    0 0 10px rgba(177,105,30,.65);
}

#curtainLeft .curtainEdge {
  right: 0;
}

#curtainRight .curtainEdge {
  left: 0;
}


/* =========================================
   3 2 1
========================================= */

#countdown {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  z-index: 8;

  font-size: 170px;
  font-weight: 900;

  color: #fff6a0;

  text-shadow:
    0 0 8px white,
    0 0 18px #ffe100,
    0 0 40px #ff9900,
    6px 6px 0 #8b3500;

  pointer-events: none;
}

.countPop {
  animation:
    countPop .72s ease-out;
}

@keyframes countPop {

  0% {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(.25)
      rotate(-8deg);
  }

  35% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1.25)
      rotate(3deg);
  }

  100% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1)
      rotate(0);
  }
}


/* =========================================
   START!
========================================= */

#startText {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%)
    scale(.3);

  z-index: 9;

  opacity: 0;

  white-space: nowrap;

  font-size: 100px;
  font-weight: 900;

  color: white;

  text-shadow:
    0 0 8px white,
    0 0 18px #55eaff,
    0 0 35px #ff6bba,
    5px 5px 0 #48237a;

  pointer-events: none;
}

#startText.show {
  animation:
    startPop .85s ease-out forwards;
}

@keyframes startPop {

  0% {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(.2);
  }

  35% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1.25);
  }

  75% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1);
  }

  100% {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(1.15);
  }
}


/* =========================================
   キラキラ
========================================= */

.sparkle {
  position: absolute;

  width: 12px;
  height: 12px;

  z-index: 7;

  pointer-events: none;

  background: white;

  transform:
    rotate(45deg);

  box-shadow:
    0 0 8px white,
    0 0 18px #ffe55b,
    0 0 30px #ffb300;

  animation:
    sparkleAnimation
    .9s ease-out forwards;
}

@keyframes sparkleAnimation {

  0% {
    opacity: 0;

    transform:
      rotate(45deg)
      scale(.1);
  }

  30% {
    opacity: 1;

    transform:
      rotate(90deg)
      scale(1.6);
  }

  100% {
    opacity: 0;

    transform:
      rotate(180deg)
      scale(.1);
  }
}


/* =========================================
   開始ボタン
========================================= */

#readyScreen {
  position: absolute;

  inset: 0;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  background:
    rgba(0,0,0,.72);

  z-index: 12000;

  color: white;

  text-align: center;
}

#readyScreen h1 {
  font-size: 64px;

  color: #ffe35a;

  margin-bottom: 18px;

  text-shadow:
    4px 4px 0 #7f351d,
    0 0 16px #ffae00;
}

#readyScreen p {
  font-size: 27px;
  font-weight: bold;

  line-height: 1.7;

  margin-bottom: 25px;
}

#controlInfo {
  display: flex;

  gap: 30px;

  margin-bottom: 28px;
}

.controlBox {
  padding: 14px 24px;

  border-radius: 16px;

  background:
    rgba(0,0,0,.55);

  font-size: 23px;
  font-weight: bold;
}

#rightInfo {
  color: #55eaff;

  border:
    3px solid #55eaff;
}

#leftInfo {
  color: #ff6bba;

  border:
    3px solid #ff6bba;
}

#playButton {
  padding:
    15px 55px;

  font-size: 31px;
  font-weight: 900;

  color: white;

  background:
    #d94b28;

  border:
    4px solid white;

  border-radius:
    18px;

  cursor: pointer;

  box-shadow:
    0 0 18px #ff9d00;
}


/* =========================================
   結果
========================================= */

#resultScreen {
  position: absolute;

  inset: 0;

  display: none;

  flex-direction: column;
  justify-content: center;
  align-items: center;

  gap: 18px;

  background:
    rgba(0,0,0,.80);

  color: white;

  text-align: center;

  z-index: 13000;
}

#resultScreen h1 {
  font-size: 60px;

  color: #ffe35a;
}

.resultScore {
  font-size: 36px;
  font-weight: bold;
}

#resultP1 {
  color: #55eaff;
}

#resultP2 {
  color: #ff6bba;
}

#totalScore {
  font-size: 48px;
  font-weight: 900;

  color: #fff36b;
}

#restartButton {
  margin-top: 15px;

  padding:
    13px 35px;

  font-size: 24px;
  font-weight: bold;

  color: white;

  background:
    #d94b28;

  border:
    3px solid white;

  border-radius:
    15px;

  cursor: pointer;
}


/* P1：通常は水色 */
.plusScore.p1 {
  color: #55eaff;
}

/* P2：通常はピンク */
.plusScore.p2 {
  color: #ff6bba;
}

/* +1000共通：少し大きく */
.plusScore.special {
  font-size: 52px;
  font-weight: 900;
}

/* P1の+1000：水色文字＋黄色い縁・光 */
.plusScore.p1.special {
  color: #55eaff;
  -webkit-text-stroke: 2px #ffe135;
  text-shadow:
    0 0 4px #ffe135,
    0 0 9px #ffe135,
    0 0 16px #ffb300,
    0 2px 4px rgba(0,0,0,.75);
}

/* P2の+1000：ピンク文字＋黄色い縁・光 */
.plusScore.p2.special {
  color: #ff6bba;
  -webkit-text-stroke: 2px #ffe135;
  text-shadow:
    0 0 4px #ffe135,
    0 0 9px #ffe135,
    0 0 16px #ffb300,
    0 2px 4px rgba(0,0,0,.75);
}

.plusScore.special::before,
.plusScore.special::after {
  content: "✦";
  position: absolute;
  color: #fff7a8;
  font-size: 0.48em;
  animation: scoreSparkle 0.55s ease-out infinite alternate;
}

.plusScore.special::before {
  left: -24%;
  top: -28%;
}

.plusScore.special::after {
  right: -24%;
  bottom: -22%;
  animation-delay: 0.18s;
}

@keyframes scoreSparkle {
  from {
    opacity: 0.35;
    transform: scale(0.65) rotate(0deg);
  }

  to {
    opacity: 1;
    transform: scale(1.2) rotate(35deg);
  }
}


</style>
</head>


<body>

<script>

/* =========================================
   設定
========================================= */

const GAME_TIME = 10;


/*
 9.5秒まで
  新しい的を出す
*/

const SPAWN_END_TIME = 9.5;


/*
  0.5秒ごと
*/

const TARGET_INTERVAL = 650;


/* 点数 */

const NORMAL_SCORE = 500;
const SPECIAL_SCORE = 1000;


/*
  1ゲームの的

  500 × 116 = 58,000
  1000 × 12 = 12,000

  合計 70,000点
*/

const NORMAL_TARGET_COUNT = 92;
const SPECIAL_TARGET_COUNT = 12;


/* 的移動 */

const TRAVEL_TIME = 2800;
const DROP_TIME = 430;


/* 照準 */

const CURSOR_SPEED = 850;
const DEADZONE = .12;


/*
  発射ボタン

  右 = ZR = 7
  左 = ZL = 6
*/

const RIGHT_SHOOT_BUTTON = 7;
const LEFT_SHOOT_BUTTON = 6;


/* =========================================
   レーン
========================================= */

const lanes = [

  {
    backX: .255,
    frontX: .235
  },

  {
    backX: .415,
    frontX: .405
  },

  {
    backX: .585,
    frontX: .595
  },

  {
    backX: .745,
    frontX: .765
  }

];


const BACK_Y = .45;
const FRONT_Y = .76;
const DROP_Y = 1.02;


/* =========================================
   HTML
========================================= */

const game =
  document.getElementById("game");

const score1Text =
  document.getElementById("score1");

const score2Text =
  document.getElementById("score2");

const timerText =
  document.getElementById("timer");

const crosshair1 =
  document.getElementById("crosshair1");

const crosshair2 =
  document.getElementById("crosshair2");

const readyScreen =
  document.getElementById("readyScreen");

const playButton =
  document.getElementById("playButton");

const opening =
  document.getElementById("opening");

const countdown =
  document.getElementById("countdown");

const startText =
  document.getElementById("startText");

const resultScreen =
  document.getElementById("resultScreen");

const resultP1 =
  document.getElementById("resultP1");

const resultP2 =
  document.getElementById("resultP2");

const totalScore =
  document.getElementById("totalScore");

const restartButton =
  document.getElementById("restartButton");


/* =========================================
   プレイヤー
========================================= */

const players = [

  {
    x: .40,
    y: .55,

    score: 0,
    shots: 0,
    hits: 0,

    crosshair:
      crosshair1,

    oldFire: false
  },

  {
    x: .60,
    y: .55,

    score: 0,
    shots: 0,
    hits: 0,

    crosshair:
      crosshair2,

    oldFire: false
  }

];


/* =========================================
   ゲーム状態
========================================= */

let playing = false;

let startTime = 0;
let previousFrame = 0;

let targets = [];

let targetDeck = [];

let nextSpawnTimes = [
  0,
  0,
  0,
  0
];


/* =========================================
   Joy-Con自動判定
========================================= */

let rightJoyConIndex = null;
let leftJoyConIndex = null;


/*
  登録画面は出さない。

  接続されているJoy-Conを見て
  自動的に左右を探す。
*/

function findJoyCons() {

  const pads =
    navigator.getGamepads
      ? Array.from(
          navigator.getGamepads()
        )
      : [];


  /*
    前に見つけたGamepadが
    まだ接続されているなら
    そのまま使う
  */

  if (
    rightJoyConIndex !== null &&
    pads[rightJoyConIndex]
  ) {

    /* そのまま */

  } else {

    rightJoyConIndex = null;
  }


  if (
    leftJoyConIndex !== null &&
    pads[leftJoyConIndex]
  ) {

    /* そのまま */

  } else {

    leftJoyConIndex = null;
  }


  /*
    Joy-Conの名前に
    Right / Left が入っていれば
    それを優先
  */

  for (
    const pad of pads
  ) {

    if (!pad) {
      continue;
    }


    const id =
      (
        pad.id ||
        ""
      ).toLowerCase();


    if (
      rightJoyConIndex === null &&
      (
        id.includes("joy-con (r)") ||
        id.includes("joy-con r") ||
        id.includes("right")
      )
    ) {

      rightJoyConIndex =
        pad.index;
    }


    if (
      leftJoyConIndex === null &&
      (
        id.includes("joy-con (l)") ||
        id.includes("joy-con l") ||
        id.includes("left")
      )
    ) {

      leftJoyConIndex =
        pad.index;
    }
  }


  /*
    Mac側で名前から左右を
    判断できなかった場合。

    接続順は
    右 → 左
    を想定。

    以前の接続方法と同じ。
  */

  const connected =
    pads.filter(
      pad => pad
    );


  if (
    connected.length >= 2
  ) {

    if (
      rightJoyConIndex === null
    ) {

      rightJoyConIndex =
        connected[0].index;
    }


    if (
      leftJoyConIndex === null
    ) {

      const other =
        connected.find(
          pad =>
            pad.index !==
            rightJoyConIndex
        );


      if (other) {

        leftJoyConIndex =
          other.index;
      }
    }
  }
}


/* =========================================
   70,000点分の的を作る
========================================= */

function makeTargetDeck() {

  targetDeck = [];


  /*
    普通 116個
  */

  for (
    let i = 0;
    i < NORMAL_TARGET_COUNT;
    i++
  ) {

    targetDeck.push(
      false
    );
  }


  /*
    顔 12個
  */

  for (
    let i = 0;
    i < SPECIAL_TARGET_COUNT;
    i++
  ) {

    targetDeck.push(
      true
    );
  }


  /*
    ランダムに並べる
  */

  for (
    let i =
      targetDeck.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      targetDeck[i],
      targetDeck[j]
    ] = [
      targetDeck[j],
      targetDeck[i]
    ];
  }
}


/* =========================================
   音
========================================= */

let audioContext = null;


function getAudioContext() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }


  if (
    audioContext.state ===
    "suspended"
  ) {

    audioContext.resume();
  }


  return audioContext;
}


/* =========================================
   カウント音
========================================= */

function playCountSound(
  finalSound = false
) {

  const ctx =
    getAudioContext();

  const now =
    ctx.currentTime;


  const oscillator =
    ctx.createOscillator();

  const gain =
    ctx.createGain();


  oscillator.type =
    finalSound
      ? "triangle"
      : "sine";


  oscillator.frequency
    .setValueAtTime(
      finalSound
        ? 880
        : 520,
      now
    );


  gain.gain
    .setValueAtTime(
      .18,
      now
    );


  gain.gain
    .exponentialRampToValueAtTime(
      .001,
      now + .18
    );


  oscillator.connect(
    gain
  );

  gain.connect(
    ctx.destination
  );


  oscillator.start(now);

  oscillator.stop(
    now + .2
  );
}


/* =========================================
   普通の命中音
========================================= */

function playNormalHitSound() {

  const ctx =
    getAudioContext();

  const now =
    ctx.currentTime;


  const oscillator =
    ctx.createOscillator();

  const gain =
    ctx.createGain();


  oscillator.type =
    "triangle";


  oscillator.frequency
    .setValueAtTime(
      430,
      now
    );


  oscillator.frequency
    .exponentialRampToValueAtTime(
      230,
      now + .09
    );


  gain.gain
    .setValueAtTime(
      .20,
      now
    );


  gain.gain
    .exponentialRampToValueAtTime(
      .001,
      now + .11
    );


  oscillator.connect(
    gain
  );

  gain.connect(
    ctx.destination
  );


  oscillator.start(now);

  oscillator.stop(
    now + .12
  );
}


/* =========================================
   スペシャル命中音
========================================= */

function playSpecialHitSound() {

  const ctx =
    getAudioContext();

  const now =
    ctx.currentTime;


  const notes = [
    880,
    1100,
    1320
  ];


  notes.forEach(
    (frequency, index) => {

      const oscillator =
        ctx.createOscillator();

      const gain =
        ctx.createGain();


      oscillator.type =
        "sine";


      oscillator.frequency.value =
        frequency;


      const noteStart =
        now +
        index * .06;


      gain.gain
        .setValueAtTime(
          .18,
          noteStart
        );


      gain.gain
        .exponentialRampToValueAtTime(
          .001,
          noteStart + .20
        );


      oscillator.connect(
        gain
      );

      gain.connect(
        ctx.destination
      );


      oscillator.start(
        noteStart
      );

      oscillator.stop(
        noteStart + .21
      );
    }
  );
}


/* =========================================
   キラキラ生成
========================================= */

function createSparkles() {

  for (
    let i = 0;
    i < 45;
    i++
  ) {

    const sparkle =
      document.createElement(
        "div"
      );


    sparkle.className =
      "sparkle";


    /*
      真ん中付近から
      キラキラさせる
    */

    sparkle.style.left =
      `${
        30 +
        Math.random() * 40
      }%`;


    sparkle.style.top =
      `${
        Math.random() * 100
      }%`;


    const size =
      5 +
      Math.random() * 13;


    sparkle.style.width =
      `${size}px`;

    sparkle.style.height =
      `${size}px`;


    sparkle.style.animationDelay =
      `${
        Math.random() * .35
      }s`;


    opening.appendChild(
      sparkle
    );


    setTimeout(
      () => {

        sparkle.remove();

      },
      1400
    );
  }
}


/* =========================================
   3 → 2 → 1 → カーテン
========================================= */

function runOpening() {

  readyScreen.style.display =
    "none";


  opening.style.display =
    "block";


  opening.classList.remove(
    "open"
  );


  startText.classList.remove(
    "show"
  );


  countdown.style.display =
    "block";


  /*
    3
  */

  showCount("3");


  /*
    2
  */

  setTimeout(
    () => {

      showCount("2");

    },
    850
  );


  /*
    1
  */

  setTimeout(
    () => {

      showCount("1");

    },
    1700
  );


  /*
    カーテンOPEN
  */

  setTimeout(
    () => {

      countdown.style.display =
        "none";


      createSparkles();


      opening.classList.add(
        "open"
      );


      startText.classList.add(
        "show"
      );


      playCountSound(
        true
      );

    },
    2550
  );


  /*
    カーテンが開いてから
    ゲーム開始
  */

  setTimeout(
    () => {

      opening.style.display =
        "none";


      startActualGame();

    },
    3600
  );
}


function showCount(number) {

  countdown.textContent =
    number;


  countdown.classList.remove(
    "countPop"
  );


  /*
    animationを
    毎回やり直す
  */

  void countdown.offsetWidth;


  countdown.classList.add(
    "countPop"
  );


  playCountSound();
}


/* =========================================
   ゲーム本体開始
========================================= */

function startActualGame() {

  /*
    Joy-Conを自動で探す
  */

  findJoyCons();


  /*
    古い的削除
  */

  for (
    const target of targets
  ) {

    target.element.remove();
  }


  targets = [];


  /*
    70,000点分を作る
  */

  makeTargetDeck();


  /*
    スコア
  */

  players[0].score = 0;
  players[1].score = 0;
  players[0].shots = 0;
  players[1].shots = 0;
  players[0].hits = 0;
  players[1].hits = 0;

  window.stageResult = null;


  /*
    照準
  */

  players[0].x = .40;
  players[0].y = .55;

  players[1].x = .60;
  players[1].y = .55;


  players[0].oldFire = false;
  players[1].oldFire = false;


  updateScores();
  updateCrosshairs();


  resultScreen.style.display =
    "none";


  timerText.textContent =
    GAME_TIME.toFixed(1);


  playing = true;


  startTime =
    performance.now();

  previousFrame =
    startTime;


  /*
    最初から
    4レーン×4個
  */

  createStartingTargets();


  for (
    let i = 0;
    i < lanes.length;
    i++
  ) {

    nextSpawnTimes[i] =
      startTime +
      TARGET_INTERVAL;
  }


  requestAnimationFrame(
    gameLoop
  );
}


/* =========================================
   最初の的
========================================= */

function createStartingTargets() {

  const startingCount = 4;

  const now =
    performance.now();


  for (
    let laneIndex = 0;
    laneIndex < lanes.length;
    laneIndex++
  ) {

    for (
      let i = 0;
      i < startingCount;
      i++
    ) {

      const fakeBorn =
        now -
        i *
        TARGET_INTERVAL;


      createTarget(
        laneIndex,
        fakeBorn
      );
    }
  }
}


/* =========================================
   的生成
========================================= */

function createTarget(
  laneIndex,
  bornTime = performance.now()
) {

  if (!playing) {
    return;
  }


  /*
    128個使い切ったら
    それ以上出さない
  */

  if (
    targetDeck.length === 0
  ) {

    return;
  }


  const isSpecial =
    targetDeck.shift();


  const element =
    document.createElement(
      "div"
    );


  if (isSpecial) {

    element.className =
      "target specialTarget";


    element.textContent =
      "";

  } else {

    element.className =
      "target";


    element.textContent =
      "";
  }


  game.appendChild(
    element
  );


  const target = {

    element,

    laneIndex,

    bornTime,

    dropping: false,

    dropStart: 0,

    dropX: 0,

    hit: false,

    special:
      isSpecial,

    score:
      isSpecial
        ? SPECIAL_SCORE
        : NORMAL_SCORE
  };


  targets.push(
    target
  );


  updateOneTarget(
    target,
    performance.now()
  );
}


/* =========================================
   的出現
========================================= */

function updateSpawning(now) {

  const elapsed =
    (
      now -
      startTime
    )
    /
    1000;


  /*
    14.5秒まで
  */

  if (
    elapsed >=
    SPAWN_END_TIME
  ) {

    return;
  }


  /*
    128個全部出したら終了
  */

  if (
    targetDeck.length === 0
  ) {

    return;
  }


  for (
    let laneIndex = 0;
    laneIndex < lanes.length;
    laneIndex++
  ) {

    while (
      now >=
        nextSpawnTimes[
          laneIndex
        ] &&
      targetDeck.length > 0
    ) {

      createTarget(
        laneIndex,
        nextSpawnTimes[
          laneIndex
        ]
      );


      nextSpawnTimes[
        laneIndex
      ] +=
        TARGET_INTERVAL;
    }
  }
}


/* =========================================
   的更新
========================================= */

function updateTargets(now) {

  const copy =
    [...targets];


  for (
    const target of copy
  ) {

    updateOneTarget(
      target,
      now
    );
  }
}


/* =========================================
   的移動
========================================= */

function updateOneTarget(
  target,
  now
) {

  if (
    target.hit
  ) {

    return;
  }


  const lane =
    lanes[
      target.laneIndex
    ];


  /* =====================
     奥 → 手前
  ===================== */

  if (
    !target.dropping
  ) {

    let progress =
      (
        now -
        target.bornTime
      )
      /
      TRAVEL_TIME;


    if (
      progress < 0
    ) {

      progress = 0;
    }


    if (
      progress >= 1
    ) {

      progress = 1;


      target.dropping =
        true;


      target.dropStart =
        now;


      target.dropX =
        lane.frontX;
    }


    const x =
      lane.backX +
      (
        lane.frontX -
        lane.backX
      ) *
      progress;


    const y =
      BACK_Y +
      (
        FRONT_Y -
        BACK_Y
      ) *
      progress;


    const scale =
      .22 +
      1.03 *
      progress;


    /*
      手前ほど上
  */

    const zIndex =
      Math.floor(
        100 +
        progress *
        1000
      );


    target.element.style.left =
      `${x * 100}%`;


    target.element.style.top =
      `${y * 100}%`;


    target.element.style.transform =
      `scale(${scale})`;


    target.element.style.zIndex =
      zIndex;


    target.element.style.opacity =
      "1";


    return;
  }


  /* =====================
     落下
  ===================== */

  let dropProgress =
    (
      now -
      target.dropStart
    )
    /
    DROP_TIME;


  if (
    dropProgress >= 1
  ) {

    removeTarget(
      target
    );

    return;
  }


  const direction =
    target.laneIndex < 2
      ? -1
      : 1;


  const x =
    target.dropX +
    direction *
    .018 *
    dropProgress;


  const y =
    FRONT_Y +
    (
      DROP_Y -
      FRONT_Y
    ) *
    dropProgress;


  const rotation =
    direction *
    12 *
    dropProgress;


  const scale =
    1.25 +
    .12 *
    dropProgress;


  let opacity =
    1;


  if (
    dropProgress >
    .65
  ) {

    opacity =
      1 -
      (
        dropProgress -
        .65
      )
      /
      .35;
  }


  target.element.style.left =
    `${x * 100}%`;


  target.element.style.top =
    `${y * 100}%`;


  target.element.style.transform =
    `scale(${scale})
     rotate(${rotation}deg)`;


  target.element.style.opacity =
    opacity;


  target.element.style.zIndex =
    1200;
}


/* =========================================
   的削除
========================================= */

function removeTarget(
  target
) {

  const index =
    targets.indexOf(
      target
    );


  if (
    index !== -1
  ) {

    targets.splice(
      index,
      1
    );
  }


  target.element.remove();
}


/* =========================================
   照準更新
========================================= */

function updateCrosshairs() {

  for (
    const player of players
  ) {

    player.crosshair.style.left =
      `${player.x * 100}%`;


    player.crosshair.style.top =
      `${player.y * 100}%`;
  }
}


/* =========================================
   スティック補正
========================================= */

function cleanAxis(value) {

  if (
    Math.abs(value) <
    DEADZONE
  ) {

    return 0;
  }


  const sign =
    Math.sign(
      value
    );


  const amount =
    (
      Math.abs(value) -
      DEADZONE
    )
    /
    (
      1 -
      DEADZONE
    );


  return (
    sign *
    amount
  );
}


/* =========================================
   照準移動
========================================= */

function movePlayer(
  player,
  axisX,
  axisY,
  deltaTime
) {

  player.x +=
    axisX *
    CURSOR_SPEED *
    deltaTime /
    game.clientWidth;


  player.y +=
    axisY *
    CURSOR_SPEED *
    deltaTime /
    game.clientHeight;


  player.x =
    Math.max(
      .02,
      Math.min(
        .98,
        player.x
      )
    );


  player.y =
    Math.max(
      .06,
      Math.min(
        .98,
        player.y
      )
    );
}


/* =========================================
   右Joy-Con
   P1 水色
   axes 2 / 3
   ZR = 7
========================================= */

function controlRightJoyCon(
  pad,
  deltaTime
) {

  if (!pad) {
    return;
  }


  const player =
    players[1];


  const x =
    cleanAxis(
      pad.axes[2] ??
      0
    );


  const y =
    cleanAxis(
      pad.axes[3] ??
      0
    );


  movePlayer(
    player,
    x,
    y,
    deltaTime
  );


  checkFire(
    player,
    pad,
    RIGHT_SHOOT_BUTTON
  );
}


/* =========================================
   左Joy-Con
   P2 ピンク
   axes 0 / 1
   ZL = 6
========================================= */

function controlLeftJoyCon(
  pad,
  deltaTime
) {

  if (!pad) {
    return;
  }


  const player =
    players[0];


  const x =
    cleanAxis(
      pad.axes[0] ??
      0
    );


  const y =
    cleanAxis(
      pad.axes[1] ??
      0
    );


  movePlayer(
    player,
    x,
    y,
    deltaTime
  );


  checkFire(
    player,
    pad,
    LEFT_SHOOT_BUTTON
  );
}


/* =========================================
   発射
========================================= */

function checkFire(
  player,
  pad,
  buttonNumber
) {

  const fire =
    !!pad.buttons[
      buttonNumber
    ]?.pressed;


  if (
    fire &&
    !player.oldFire
  ) {

    shoot(
      player
    );
  }


  player.oldFire =
    fire;
}


/* =========================================
   HIT判定
========================================= */

function shoot(player) {

  if (
    !playing
  ) {

    return;
  }


  player.shots++;


  const gameRect =
    game.getBoundingClientRect();


  const cursorX =
    gameRect.left +
    player.x *
    gameRect.width;


  const cursorY =
    gameRect.top +
    player.y *
    gameRect.height;


  /*
    手前の的から判定
  */

  const targetCopy =
    [...targets]

      .filter(
        target =>
          !target.hit &&
          !target.dropping
      )

      .sort(
        (a, b) => {

          const az =
            Number(
              a.element.style.zIndex
            ) || 0;


          const bz =
            Number(
              b.element.style.zIndex
            ) || 0;


          return (
            bz - az
          );
        }
      );


  for (
    const target of targetCopy
  ) {

    const rect =
      target.element
        .getBoundingClientRect();


    if (
      cursorX >= rect.left &&
      cursorX <= rect.right &&
      cursorY >= rect.top &&
      cursorY <= rect.bottom
    ) {

      hitTarget(
        player,
        target
      );


      return;
    }
  }
}


/* =========================================
   HIT
========================================= */

function hitTarget(
  player,
  target
) {

  target.hit =
    true;


  player.score +=
    target.score;

  player.hits++;


  updateScores();


  if (
    target.special
  ) {

    playSpecialHitSound();

  } else {

    playNormalHitSound();
  }


  /* 得点表示 */

  const plus =
    document.createElement(
      "div"
    );


  const playerClass =
  player === players[0]
    ? "p1"
    : "p2";

plus.className =
  `plusScore ${playerClass}${target.special ? " special" : ""}`;


  plus.textContent =
    `+${target.score}`;


  const rect =
    target.element
      .getBoundingClientRect();


  const gameRect =
    game.getBoundingClientRect();


  plus.style.left =
    `${
      rect.left -
      gameRect.left +
      rect.width / 2
    }px`;


  plus.style.top =
    `${
      rect.top -
      gameRect.top +
      rect.height / 2
    }px`;


  game.appendChild(
    plus
  );


  setTimeout(
    () => {

      plus.remove();

    },
    700
  );


  removeTarget(
    target
  );
}


/* =========================================
   スコア
========================================= */

function updateScores() {

  score1Text.textContent =
    `P1 : ${players[0].score}`;


  score2Text.textContent =
    `P2 : ${players[1].score}`;
}


/* =========================================
   ゲームループ
========================================= */

function gameLoop(now) {

  if (
    !playing
  ) {

    return;
  }


  let deltaTime =
    (
      now -
      previousFrame
    )
    /
    1000;


  previousFrame =
    now;


  deltaTime =
    Math.min(
      deltaTime,
      .05
    );


  const elapsed =
    (
      now -
      startTime
    )
    /
    1000;


  const remaining =
    GAME_TIME -
    elapsed;


  /*
    15秒ピッタリ
  */

  if (
    remaining <= 0
  ) {

    timerText.textContent =
      "0.0";


    endGame();

    return;
  }


  timerText.textContent =
    remaining.toFixed(1);


  /*
    接続が変わった場合にも
    再確認
  */

  findJoyCons();


  const pads =
    navigator.getGamepads
      ? navigator.getGamepads()
      : [];


  const rightPad =
    rightJoyConIndex !== null
      ? pads[
          rightJoyConIndex
        ]
      : null;


  const leftPad =
    leftJoyConIndex !== null
      ? pads[
          leftJoyConIndex
        ]
      : null;


  controlRightJoyCon(
    rightPad,
    deltaTime
  );


  controlLeftJoyCon(
    leftPad,
    deltaTime
  );


  updateCrosshairs();

  updateSpawning(
    now
  );

  updateTargets(
    now
  );


  requestAnimationFrame(
    gameLoop
  );
}


/* =========================================
   終了
========================================= */

function endGame() {

  playing =
    false;


  for (
    const target of targets
  ) {

    target.element.remove();
  }


  targets = [];


  resultP1.textContent =
    `🩵 P1 BONUS：${players[0].score}点`;


  resultP2.textContent =
    `🩷 P2 BONUS：${players[1].score}点`;


  const total =
    players[0].score +
    players[1].score;


  window.stageResult = {
    finished: true,
    stage: "bonus",
    score1: players[0].score,
    score2: players[1].score,
    shots1: players[0].shots,
    shots2: players[1].shots,
    hits1: players[0].hits,
    hits2: players[1].hits
  };


  totalScore.textContent =
    `TOTAL：${total}点`;


  resultScreen.style.display =
    "flex";
}


/* =========================================
   ボタン
========================================= */

playButton.addEventListener(
  "click",
  () => {

    /*
      ブラウザの音を有効化
    */

    getAudioContext();


    /*
      Joy-Con確認
    */

    findJoyCons();


    /*
      3・2・1開始
    */

    runOpening();
  }
);


restartButton.addEventListener(
  "click",
  () => {

    resultScreen.style.display =
      "none";


    runOpening();
  }
);


/* =========================================
   Macでテスト
   マウス = P1
========================================= */

game.addEventListener(
  "mousemove",
  event => {

    if (
      !playing
    ) {

      return;
    }


    const rect =
      game.getBoundingClientRect();


    players[0].x =
      (
        event.clientX -
        rect.left
      )
      /
      rect.width;


    players[0].y =
      (
        event.clientY -
        rect.top
      )
      /
      rect.height;


    updateCrosshairs();
  }
);


game.addEventListener(
  "mousedown",
  () => {

    if (
      playing
    ) {

      shoot(
        players[0]
      );
    }
  }
);


/*
  SPACE = P1
  ENTER = P2
*/

window.addEventListener(
  "keydown",
  event => {

    if (
      !playing
    ) {

      return;
    }


    if (
      event.code ===
      "Space"
    ) {

      event.preventDefault();


      shoot(
        players[0]
      );
    }


    if (
      event.code ===
      "Enter"
    ) {

      shoot(
        players[1]
      );
    }
  }
);


/* =========================================
   最初
========================================= */

updateCrosshairs();

findJoyCons();

</script>
