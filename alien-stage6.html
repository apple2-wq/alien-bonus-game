<!DOCTYPE html>
<html lang="ja">

<head>

<title>ALIEN STAGE 6</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #080319;

  font-family: Arial, sans-serif;

  user-select: none;
}


/* =========================
   ゲーム全体
========================= */

#gameWrapper {
  width: 100vw;
  height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  background: #080319;
}


#game {
  position: relative;

  width: min(100vw, 177.78vh);

  aspect-ratio: 16 / 9;

  overflow: hidden;

  background-image:
    url("background.jpeg");

  background-size:
    100% 100%;

  background-position:
    center;

  background-repeat:
    no-repeat;

  touch-action: manipulation;
}


/* =========================
   HUD
========================= */

#hud {
  position: absolute;

  z-index: 1000;

  top: 2%;
  left: 50%;

  transform:
    translateX(-50%);

  width: 72%;

  display: flex;

  justify-content: space-between;
  align-items: center;

  pointer-events: none;
}


.hudBox {
  background:
    rgba(15,5,55,0.88);

  border:
    3px solid #ffc93b;

  border-radius:
    14px;

  padding:
    7px 14px;

  color: white;

  font-weight: 900;

  font-size:
    clamp(11px,1.7vw,24px);

  box-shadow:
    0 0 12px #ff9f1c,
    inset 0 0 10px #40149c;
}


#score1 {
  color: #55eaff;
}


#score2 {
  color: #ff6bba;
}


#time {
  color: #ffe44d;
}


/* =========================
   穴
========================= */

.hole {
  position: absolute;

  left: var(--x);
  top: var(--y);

  width: var(--size);

  height:
    calc(var(--size) * 2.2);

  transform:
    translate(-50%,-100%);

  pointer-events: none;

  overflow: visible;

  z-index: 20;
}


/* =========================
   キャラクター
========================= */

.alien {
  position: absolute;

  width: 140%;
  height: auto;

  left: 50%;
  bottom: 0;

  transform:
    translate(-50%,70%)
    scale(0.85);

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

  filter:
    drop-shadow(
      0 5px 5px
      rgba(0,0,0,0.45)
    );
}


.hole.active .alien {
  visibility: visible;

  pointer-events: auto;

  animation:
    alienPop
    0.38s
    cubic-bezier(0.2,0.9,0.3,1.25)
    forwards;
}


@keyframes alienPop {

  0% {
    transform:
      translate(-50%,70%)
      scale(0.82);

    opacity: 0;
  }

  45% {
    transform:
      translate(-50%,-12%)
      scale(1.07);

    opacity: 1;
  }

  70% {
    transform:
      translate(-50%,-2%)
      scale(0.98);

    opacity: 1;
  }

  100% {
    transform:
      translate(-50%,-4%)
      scale(1);

    opacity: 1;
  }

}


/* =========================
   撃たれた
========================= */

.alien.shot {
  animation:
    alienShot
    0.20s
    forwards !important;

  pointer-events: none;
}


@keyframes alienShot {

  0% {
    transform:
      translate(-50%,-4%)
      scale(1);

    opacity: 1;
  }

  100% {
    transform:
      translate(-50%,45%)
      scale(0.35)
      rotate(12deg);

    opacity: 0;
  }

}


/* =========================
   王冠キラキラ
========================= */

.hole.rare .alien {
  filter:
    drop-shadow(0 0 5px white)
    drop-shadow(0 0 10px #ffe66d)
    drop-shadow(0 0 18px #ff87e8);
}


.hole.rare.active::before,
.hole.rare.active::after {
  position: absolute;

  z-index: 100;

  content: "✦";

  pointer-events: none;

  color: #fff4a3;

  text-shadow:
    0 0 4px white,
    0 0 9px #ffd84d,
    0 0 16px #ff7dea;
}


.hole.rare.active::before {
  left: -5%;
  top: -5%;

  font-size: 26px;

  animation:
    sparkleLeft
    0.75s
    infinite;
}


.hole.rare.active::after {
  right: -10%;
  top: 5%;

  font-size: 20px;

  animation:
    sparkleRight
    0.95s
    infinite;
}


/* =========================
   10000点
========================= */

.hole.superRare .alien {
  filter:
    drop-shadow(0 0 7px white)
    drop-shadow(0 0 14px #fff45b)
    drop-shadow(0 0 24px #ffad32)
    drop-shadow(0 0 35px #ff4fd8);
}


.hole.superRare.active::before {
  content: "✦ ✨ ✦";

  font-size: 30px;
}


/* =========================
   敵
========================= */

.hole.enemy .alien {
  filter:
    drop-shadow(0 0 7px #ff4141)
    drop-shadow(0 0 15px #8b0000);
}


@keyframes sparkleLeft {

  0% {
    opacity: 0;

    transform:
      translateY(10px)
      scale(0.3);
  }

  45% {
    opacity: 1;
  }

  100% {
    opacity: 0;

    transform:
      translate(-7px,-17px)
      scale(1.3)
      rotate(35deg);
  }

}


@keyframes sparkleRight {

  0% {
    opacity: 0;

    transform:
      translateY(10px)
      scale(0.4);
  }

  50% {
    opacity: 1;
  }

  100% {
    opacity: 0;

    transform:
      translate(8px,-14px)
      scale(1.2)
      rotate(-30deg);
  }

}


/* =========================
   照準
========================= */

.crosshair {
  position: absolute;

  z-index: 4500;

  transform:
    translate(-50%,-50%);

  font-size:
    clamp(40px,5vw,65px);

  font-weight: 900;

  line-height: 1;

  pointer-events: none;
}


/* P1 水色 */

#crosshair1 {
  left: 40%;
  top: 55%;

  color: #55eaff;

  text-shadow:
    0 0 4px black,
    0 0 10px #55eaff,
    0 0 18px #55eaff;
}


/* P2 ピンク */

#crosshair2 {
  left: 60%;
  top: 55%;

  color: #ff6bba;

  text-shadow:
    0 0 4px black,
    0 0 10px #ff6bba,
    0 0 18px #ff6bba;
}


/* =========================
   得点POP
========================= */

.pointPopup {
  position: absolute;

  z-index: 3500;

  pointer-events: none;

  font-weight: 900;

  font-size:
    clamp(20px,4vw,48px);

  text-shadow:
    2px 2px 0 #281063,
    0 0 8px white;

  transform:
    translate(-50%,-50%);

  animation:
    pointPopupAnimation
    0.8s
    forwards;
}


@keyframes pointPopupAnimation {

  0% {
    opacity: 0;

    transform:
      translate(-50%,-50%)
      scale(0.3);
  }

  30% {
    opacity: 1;

    transform:
      translate(-50%,-80%)
      scale(1.25);
  }

  100% {
    opacity: 0;

    transform:
      translate(-50%,-180%)
      scale(1);
  }

}


/* =========================
   発射エフェクト
========================= */

.shotEffect {
  position: absolute;

  z-index: 4000;

  pointer-events: none;

  width: 18px;
  height: 18px;

  border-radius: 50%;

  border:
    4px solid white;

  box-shadow:
    0 0 8px white,
    0 0 18px #ffe332,
    0 0 30px #ff9c22;

  transform:
    translate(-50%,-50%);

  animation:
    shotEffectAnimation
    0.3s
    forwards;
}


@keyframes shotEffectAnimation {

  from {
    width: 14px;
    height: 14px;

    opacity: 1;
  }

  to {
    width: 65px;
    height: 65px;

    opacity: 0;
  }

========================= */

#startScreen,

/* =========================

.p1Final {

#winnerText {

/* =========================
   カーテン
========================= */

#introScreen {
  position: absolute;

  inset: 0;

  z-index: 9000;

  display: none;

  overflow: hidden;

  pointer-events: none;
}


.curtain {
  position: absolute;

  top: 0;

  width: 51%;
  height: 100%;

  z-index: 2;

  /* ウエスタン風の赤茶・えんじ */
  background:
    repeating-linear-gradient(
      90deg,
      #3b160f 0%,
      #6b2418 7%,
      #923522 14%,
      #5b1d14 21%
    );

  box-shadow:
    inset 0 0 35px rgba(255,190,95,.12),

  transition:
    transform

}


#curtainLeft {
  left: 0;

  border-right:

}


#curtainRight {
  right: 0;

    8px solid #b77a2a;
}


#introScreen.open

#introScreen.open

/* =========================

========================= */

  z-index: 5;

  top: 50%;

  line-height: 1;

.countPop {

@keyframes countPopAnimation {

  0% {
    opacity: 0;

    transform:

  }

  35% {
    opacity: 1;

    transform:
      translate(-50%,-50%)
      scale(1.25);
  }

  100% {
    opacity: 1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }

/* =========================
   START!
========================= */

#startFlash {
  position: absolute;

  z-index: 6;

  left: 50%;
  top: 50%;

  color: #fff54f;

#startFlash.show {
  animation:

@keyframes startFlashAnimation {

  0% {

      translate(-50%,-50%)
      scale(1);
  }

    opacity: 0;

    transform:

      scale(1.15);
  }

}


@media (max-width:700px) {

  #hud {
    width: 80%;
  }


  .hudBox {
    padding:
      4px 7px;
  }

}

/* ========================================

======================================== */

function getConnectedPads() {

  return Array.from(
    navigator.getGamepads()
  ).filter(
    pad =>
      pad !== null
  );

}


/* ========================================
   右Joy-Con取得
======================================== */

function getRightPad() {

  const pads =
    getConnectedPads();


  /*
    名前で右を探す
  */

  const byName =
    pads.find(

      pad => {

        const name =
          pad.id.toLowerCase();


        return (

          name.includes(
            "joy-con (r)"
          )

          ||

          name.includes(
            "joy-con r"
          )

          ||

          name.includes(
            "right"
          )

        );

      }

    );


  if (
    byName
  ) {

    return byName;

  }


  /*
    右Joy-Conは
    axes 2 / 3を使うため
    axesが4つ以上あるものを優先
  */

  const byAxes =
    pads.find(

      pad =>
        pad.axes.length >= 4

    );


  return (

    byAxes

    ||

    pads[0]

    ||

    null

  );

}


/* ========================================
   左Joy-Con取得
======================================== */

function getLeftPad(
  rightPad
) {

  const pads =
    getConnectedPads();


  /*
    名前で左を探す
  */

  const byName =
    pads.find(

      pad => {

        const name =
          pad.id.toLowerCase();


        return (

          name.includes(
            "joy-con (l)"
          )

          ||

          name.includes(
            "joy-con l"
          )

          ||

          name.includes(
            "left"
          )

        );

      }

    );


  if (

    byName

    &&

    byName !== rightPad

  ) {

    return byName;

  }


  /*
    右Joy-Conではない方を
    左として使う
  */

  return (

    pads.find(

      pad =>
        pad !== rightPad

    )

    ||

    null

  );

}


/* ========================================
   360° STICK
======================================== */

function getStickVector(
  rawX,
  rawY
) {

  const magnitude =
    Math.sqrt(

      rawX * rawX

      +

      rawY * rawY

    );


  if (
    magnitude <= DEAD_ZONE
  ) {

    return {
      x:0,
      y:0
    };

  }


  const clamped =
    Math.min(
      magnitude,
      1
    );


  const adjusted =
    (
      clamped
      -
      DEAD_ZONE
    )
    /
    (
      1
      -
      DEAD_ZONE
    );


  const curved =
    Math.pow(
      adjusted,
      STICK_CURVE
    );


  return {

    x:
      (
        rawX
        /
        magnitude
      )
      *
      curved,

    y:
      (
        rawY
        /
        magnitude
      )
      *
      curved

  };

}


/* ========================================
   CONTROLLER LOOP
======================================== */

function updateControllers() {

  const rightPad =
    getRightPad();


  const leftPad =
    getLeftPad(
      rightPad
    );


  /* =====================================
     P1 右Joy-Con
  ===================================== */

  if (
    rightPad
    &&
    gameRunning
  ) {

    const rawX =
      rightPad.axes[
        RIGHT_AXIS_X
      ] || 0;


    const rawY =
      rightPad.axes[
        RIGHT_AXIS_Y
      ] || 0;


    const stick =
      getStickVector(
        rawX,
        rawY
      );


    aim1X +=
      stick.x
      *
      AIM_SPEED;


    aim1Y +=
      stick.y
      *
      AIM_SPEED;


    aim1X =
      Math.max(
        2,
        Math.min(
          98,
          aim1X
        )
      );


    aim1Y =
      Math.max(
        3,
        Math.min(
          97,
          aim1Y
        )
      );


    crosshair1.style.left =
      aim1X + "%";


    crosshair1.style.top =
      aim1Y + "%";


    /*
      ★固定ZR
    */

    const shootPressed =

      rightPad.buttons[
        RIGHT_SHOOT_BUTTON
      ]?.pressed

      ||

      false;


    if (

      shootPressed

      &&

      !previousRightShoot

    ) {

      shootWithCrosshair(
        1
      );

    }


    previousRightShoot =
      shootPressed;

  }


  /* =====================================
     P2 左Joy-Con
  ===================================== */

  if (
    leftPad
    &&
    gameRunning
  ) {

    const rawX =
      leftPad.axes[
        LEFT_AXIS_X
      ] || 0;


    const rawY =
      leftPad.axes[
        LEFT_AXIS_Y
      ] || 0;


    const stick =
      getStickVector(
        rawX,
        rawY
      );


    aim2X +=
      stick.x
      *
      AIM_SPEED;


    aim2Y +=
      stick.y
      *
      AIM_SPEED;


    aim2X =
      Math.max(
        2,
        Math.min(
          98,
          aim2X
        )
      );


    aim2Y =
      Math.max(
        3,
        Math.min(
          97,
          aim2Y
        )
      );


    crosshair2.style.left =
      aim2X + "%";


    crosshair2.style.top =
      aim2Y + "%";


    /*
      ★固定ZL
    */

    const shootPressed =

      leftPad.buttons[
        LEFT_SHOOT_BUTTON
      ]?.pressed

      ||

      false;


    if (

      shootPressed

      &&

      !previousLeftShoot

    ) {

      shootWithCrosshair(
        2
      );

    }


    previousLeftShoot =
      shootPressed;

  }


  requestAnimationFrame(
    updateControllers
  );

}


/* ========================================
   CHARACTER BAG
======================================== */

function makeCharacterBag() {

  characterBag =
    [];


  Object.entries(
    CHARACTER_TYPES
  ).forEach(

    ([type,data]) => {

      for (
        let i = 0;
        i < data.count;
        i++
      ) {

        characterBag.push({

          type:
            type,

          image:
            data.image,

          points:
            data.points,

          rare:
            data.rare,

          superRare:
            data.superRare,

          enemy:
            data.enemy

        });

      }

    }

  );


  /*
    シャッフル
  */

  for (
    let i =
      characterBag.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(

        Math.random()

        *

        (i + 1)

      );


    [
      characterBag[i],
      characterBag[j]
    ]
    =
    [
      characterBag[j],
      characterBag[i]
    ];

  }


  characterIndex =
    0;

}

/* ========================================
   SPAWN
   91体
======================================== */

function startSpawning() {

  let wavePattern =
    [];


  /*
    2 × 7 = 14
  */

  for (
    let i = 0;
    i < 7;
    i++
  ) {

    wavePattern.push(
      2
    );

  }


  /*
    3 × 15 = 45
  */

  for (
    let i = 0;
    i < 15;
    i++
  ) {

    wavePattern.push(
      3
    );

  }


  /*
    4 × 8 = 32

    14 + 45 + 32 = 91
  */

  for (
    let i = 0;
    i < 8;
    i++
  ) {

    wavePattern.push(
      4
    );

  }


  /*
    波順をシャッフル
  */

  for (
    let i =
      wavePattern.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(

        Math.random()

        *

        (i + 1)

      );


    [
      wavePattern[i],
      wavePattern[j]
    ]
    =
    [
      wavePattern[j],
      wavePattern[i]
    ];

  }


  let waveIndex =
    0;


  function nextWave() {

    if (
      !gameRunning
    ) {

      return;

    }


    if (
      waveIndex
      >=
      wavePattern.length
    ) {

      return;

    }


    const spawnCount =
      wavePattern[
        waveIndex
      ];


    waveIndex++;


    for (
      let i = 0;
      i < spawnCount;
      i++
    ) {

      if (
        characterIndex
        >=
        characterBag.length
      ) {

        break;

      }


      setTimeout(

        showRandomAlien,

        i * 60

      );

    }


    spawnTimer =
      setTimeout(

        nextWave,

        1000

      );

  }


  nextWave();

}


/* ========================================
   SHOOT
======================================== */

function shootWithCrosshair(
  player
) {

  if (
    !gameRunning
  ) {

    return;

  }


  if (player === 1) {
    shots1++;
  }

  else {
    shots2++;
  }


  const crosshair =

    player === 1

      ? crosshair1

      : crosshair2;


  const crosshairRect =
    crosshair.getBoundingClientRect();


  const aimCenterX =
    crosshairRect.left
    +
    crosshairRect.width / 2;


  const aimCenterY =
    crosshairRect.top
    +
    crosshairRect.height / 2;


  const activeAliens =
    document.querySelectorAll(
      ".hole.active .alien"
    );


  let hit =
    false;


  for (
    const alien
    of activeAliens
  ) {

    if (
      alien.classList.contains(
        "shot"
      )
    ) {

      continue;

    }


    const rect =
      alien.getBoundingClientRect();


    if (

      aimCenterX >= rect.left

      &&

      aimCenterX <= rect.right

      &&

      aimCenterY >= rect.top

      &&

      aimCenterY <= rect.bottom

    ) {

      const hole =
        alien.closest(
          ".hole"
        );


      hitAlien(

        player,

        hole,

        alien,

        aimCenterX,

        aimCenterY

      );


      hit =
        true;


      break;

    }

  }


  if (
    !hit
  ) {

    const gameRect =
      game.getBoundingClientRect();


    showShotEffect(

      aimCenterX
      -
      gameRect.left,

      aimCenterY
      -
      gameRect.top

    );

  }

}


/* ========================================
   HIT
======================================== */

function hitAlien(

  player,

  hole,

  alien,

  clientX,

  clientY

) {

  if (

    !gameRunning

    ||

    !hole.classList.contains(
      "active"
    )

    ||

    alien.classList.contains(
      "shot"
    )

  ) {

    return;

  }


  alien.classList.add(
    "shot"
  );


  const points =
    Number(
      alien.dataset.points
    );


  if (
    player === 1
  ) {

    hits1++;

    score1 +=
      points;


    scoreText1.textContent =
      score1;

  }

  else {

    hits2++;

    score2 +=
      points;


    scoreText2.textContent =
      score2;

  }


  playHitSound(
    points
  );


  const gameRect =
    game.getBoundingClientRect();


  const x =
    clientX
    -
    gameRect.left;


  const y =
    clientY
    -
    gameRect.top;


  showShotEffect(
    x,
    y
  );


  showPoints(
    x,
    y,
    points,
    player
  );


  const hitSpawnId =
    hole.dataset.spawnId;


  setTimeout(

    () => {

      if (
        hole.dataset.spawnId
        !==
        hitSpawnId
      ) {

        return;

      }


      clearHole(
        hole,
        alien
      );

    },

    200

  );

}

/* ========================================
   AUDIO
======================================== */

let audioContext =
  null;


function getAudioContext() {

  if (
    !audioContext
  ) {

    audioContext =

      new (

        window.AudioContext

        ||

        window.webkitAudioContext

      )();

  }


  return audioContext;

}


/* ========================================
   TONE
======================================== */

function playTone(
  frequency,
  duration,
  volume = 0.10
) {

  const context =
    getAudioContext();


  const oscillator =
    context.createOscillator();


  const gain =
    context.createGain();


  oscillator.connect(
    gain
  );


  gain.connect(
    context.destination
  );


  oscillator.type =
    "sine";


  oscillator.frequency.value =
    frequency;


  gain.gain.setValueAtTime(

    volume,

    context.currentTime

  );


  gain.gain.exponentialRampToValueAtTime(

    0.001,

    context.currentTime
    +
    duration

  );


  oscillator.start();


  oscillator.stop(

    context.currentTime
    +
    duration

  );

}

}


/* ========================================
   ACTUAL GAME START
======================================== */

function beginActualGame() {

  score1 =
    0;


  score2 =
    0;


  timeLeft =
    GAME_TIME;


  gameRunning =
    true;


  makeCharacterBag();


  scoreText1.textContent =
    score1;


  scoreText2.textContent =
    score2;


  timeText.textContent =
    timeLeft;


  startSpawning();


  timerInterval =

    setInterval(

      () => {

        timeLeft--;


        timeText.textContent =
          timeLeft;


        if (
          timeLeft <= 0
        ) {

          endGame();

        }

      },

      1000

    );

}


/* ========================================
   GAME OVER
======================================== */

function endGame() {

  gameRunning =
    false;


  clearInterval(
    timerInterval
  );


  clearTimeout(
    spawnTimer
  );


  document
    .querySelectorAll(
      ".hole"
    )
    .forEach(

      hole => {

        const alien =
          hole.querySelector(
            ".alien"
          );


        clearHole(
          hole,
          alien
        );

      }

    );


  finalScore1.textContent =
    score1;


  finalScore2.textContent =
    score2;


  window.stageResult = {
    finished: true,
    stage: "alien",
    score1,
    score2,
    shots1,
    shots2,
    hits1,
    hits2
  };


  if (
    score1 > score2
  ) {

    winnerText.textContent =
      "🏆 PLAYER 1 WIN!";

  }


  else if (
    score2 > score1
  ) {

    winnerText.textContent =
      "🏆 PLAYER 2 WIN!";

  }


  else {

    winnerText.textContent =
      "🤝 DRAW!";

  }


  gameOverScreen.style.display =
    "flex";

}


/* ========================================
   BUTTONS
======================================== */

startButton.addEventListener(

  "click",

  startIntro

);


restartButton.addEventListener(

  "click",

  startIntro

);


/* ========================================
   iPad / mouse test
   タップ = P1
======================================== */

game.addEventListener(

  "pointerdown",

  event => {

    if (
      !gameRunning
    ) {

      return;

    }


    if (
      event.target.closest(
        ".gameButton"
      )
    ) {

      return;

    }


    shots1++;


    const activeAliens =
      document.querySelectorAll(
        ".hole.active .alien"
      );


    for (
      const alien
      of activeAliens
    ) {

      if (
        alien.classList.contains(
          "shot"
        )
      ) {

        continue;

      }


      const rect =
        alien.getBoundingClientRect();


      if (

        event.clientX >= rect.left

        &&

        event.clientX <= rect.right

        &&

        event.clientY >= rect.top

        &&

        event.clientY <= rect.bottom

      ) {

        const hole =
          alien.closest(
            ".hole"
          );


        hitAlien(

          1,

          hole,

          alien,

          event.clientX,

          event.clientY

        );


        return;

      }

    }


    const gameRect =
      game.getBoundingClientRect();


    showShotEffect(

      event.clientX
      -
      gameRect.left,

      event.clientY
      -
      gameRect.top

    );

  }

);


/* ========================================
   INITIALIZE
======================================== */

createHoles();

updateControllers();

</script>
